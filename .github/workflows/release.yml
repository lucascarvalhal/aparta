name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag, pyproject.toml and npm/package.json must agree
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PY=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          NPM=$(node -p "require('./npm/package.json').version")
          echo "tag=$TAG pyproject=$PY npm=$NPM"
          [ "$TAG" = "$PY" ] && [ "$TAG" = "$NPM" ]

  build:
    needs: check-versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Build sdist and wheel
        run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-npm:
    needs: check-versions
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish launcher to npm (trusted publishing)
        working-directory: npm
        run: npm publish
