name: Bug report
description: Something in aparta is not working as expected
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug, including the full command you ran and the output you got.
      placeholder: "I ran `aparta ...` and it failed with ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: aparta version
      description: Output of `aparta --version`
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      description: Output of `python --version`
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows (WSL)
        - Other
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `aparta doctor`
      description: Paste the output if relevant, remove anything sensitive first.
      render: shell
